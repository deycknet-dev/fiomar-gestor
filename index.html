<script>

function cleanDb(d){const A=k=>Array.isArray(d[k])?d[k]:[],S1=x=>x==null?x:SID(x),it=l=>(Array.isArray(l)?l:[]).map(i=>({...i,pid:S1(i.pid)})),fo=l=>(Array.isArray(l)?l:[]).map(f=>({...f,id:S1(f.id)}));
 d.clients=A('clients').map(x=>({...x,id:SID(x.id)}));d.vehicles=A('vehicles').map(x=>({...x,id:SID(x.id),cli:SID(x.cli)}));
 d.quotes=A('quotes').map(q=>({...q,id:SID(q.id),cli:SID(q.cli),veh:SID(q.veh),os:S1(q.os),items:it(q.items),fotos:fo(q.fotos)}));

 d.appts=A('appts').map(a=>({...a,id:SID(a.id),cli:SID(a.cli),veh:SID(a.veh),os:S1(a.os)}));d.svcs=A('svcs').map(x=>({...x,id:SID(x.id)}));
 d.prods=A('prods').map(x=>({...x,id:SID(x.id)}));d.movs=A('movs').map(x=>({...x,id:SID(x.id),pid:SID(x.pid)}));d.desp=A('desp').map(x=>({...x,id:SID(x.id)}));return d}
function load(){return{clients:[],vehicles:[],quotes:[],orders:[],appts:[],svcs:[],seq:1,qseq:1}}
/* ---------- Supabase: login e banco de dados ---------- */
const SBK='wab_sb';let SB=null,SES=null,TS=null,PEND=false,AM='in';
/* >>> PREENCHA AQUI UMA VEZ (Supabase: Project Settings > API). Com isso, ninguém precisa colar nada no aparelho. <<< */

const cfg0=()=>{if(SB_URL&&SB_KEY)return{url:SB_URL,key:SB_KEY};try{return JSON.parse(localStorage.getItem(SBK))||{}}catch(x){return{}}};
let LASTV=null,CONF=false,DIRTY=false;
async function pull(){const{data,error}=await SB.from('wab_data').select('data,updated_at').eq('id',SES.user.id).maybeSingle();
 if(error){toast('Erro ao carregar os dados: '+error.message);return}
 db=data&&data.data&&data.data.clients?cleanDb(data.data):load();LASTV=data?data.updated_at:null;CONF=false;DIRTY=false;if(!data)await push();fixEstoque()}
async function push(){if(!SB||!SES||PEND||CONF)return;DIRTY=false;const row={data:db,updated_at:new Date().toISOString()};
 const q=LASTV?SB.from('wab_data').update(row).eq('id',SES.user.id).eq('updated_at',LASTV):SB.from('wab_data').upsert({id:SES.user.id,...row});
 const{data,error}=await q.select('updated_at');
 if(error){DIRTY=true;return toast('Falha ao salvar na nuvem: '+error.message)}
 if(LASTV&&!(data&&data.length)){const c=await SB.from('wab_data').select('updated_at').eq('id',SES.user.id).maybeSingle();
  if(c.data&&c.data.updated_at!=LASTV){DIRTY=true;return conflito()}DIRTY=true;return toast('Não foi possível salvar. Verifique sua conexão e permissões.')}
 LASTV=data&&data[0]?data[0].updated_at:row.updated_at}

async function gate(){const em=(SES.user.email||'').toLowerCase();const{data,error}=await SB.from('wab_members').select('email,admin').eq('email',em).maybeSingle();PEND=!error&&!data;ADM=!!(data&&data.admin);

async function waDoc(gen,arg,phone,txt){
 if(noLib())return false;
 if(!waNum(phone)){toast('Cliente sem telefone cadastrado');return false}
 toast('Gerando o PDF...');CAP={};
 try{await gen(arg)}catch(er){CAP=null;toast('Não foi possível gerar o PDF');return false}
 const r=CAP;CAP=null;if(!r.blob)return false;
 WD={blob:r.blob,name:r.name,phone:waNum(phone),txt};
 waDocModal();return true}
function waDocModal(msg){const w=WD;if(!w)return;const u=`https://wa.me/${w.phone}?text=${encodeURIComponent(w.txt)}`;
 const can=(()=>{try{return navigator.canShare&&navigator.canShare({files:[new File([w.blob],w.name,{type:'application/pdf'})]})}catch(x){return 0}})();
 $('#modal').innerHTML=`<div class="ov"><div class="md"><h2 style="margin-top:0">PDF pronto para enviar</h2>${msg?`<p style="color:var(--dg,#c0392b)">${e(msg)}</p>`:''}<p class="muted">${can?'<b>1.</b> Toque em “Enviar PDF” e escolha o WhatsApp e o cliente. A mensagem fica copiada: se não aparecer no envio, cole no campo de texto.':'Baixe o PDF, abra a conversa do cliente e anexe o arquivo (clipe).'}</p><textarea readonly onfocus="this.select()">${e(w.txt)}</textarea><div class="bar" style="margin:10px 0 0">${can?'<button class="pr" onclick="waDocShare()">Enviar PDF</button>':''}<a class="btn" href="${u}" target="_blank" rel="noopener" style="background:#1E9E55;color:#fff;border-color:#1E9E55;text-decoration:none">Abrir conversa com a mensagem</a><button onclick="dlBlob(WD.blob,WD.name)">Baixar PDF</button><button onclick="copiaTxt(WD.txt).then(k=>toast(k?'Mensagem copiada':'Selecione o texto e copie'))">Copiar mensagem</button><span class="sp"></span><button onclick="closeM()">Fechar</button></div></div></div>`}
async function waDocShare(){const w=WD;if(!w)return;const f=new File([w.blob],w.name,{type:'application/pdf'});
 copiaTxt(w.txt);
 try{await navigator.share({files:[f],text:w.txt,title:w.name});closeM();return}
 catch(er){if(er&&er.name=='AbortError')return;
  try{await navigator.share({files:[f]});closeM();return}
  catch(e2){if(e2&&e2.name=='AbortError')return;waDocModal('Não foi possível abrir o compartilhamento ('+((e2&&e2.name)||'erro')+'). Use Baixar PDF e anexe no WhatsApp.')}}}

 if(m.includes('r'))x2=Math.min(W,Math.max(x1+MIN,x2+dx));
 if(m.includes('t'))y1=Math.max(0,Math.min(y2-MIN,y1+dy));
 if(m.includes('b'))y2=Math.min(H,Math.max(y1+MIN,y2+dy));
 const n={x:x1,y:y1,w:x2-x1,h:y2-y1};
 if(a){if(/[lr]/.test(m)){n.h=n.w/a;n.y=m.includes('t')?o.y+o.h-n.h:m.includes('b')?o.y:o.y+o.h/2-n.h/2}
  else{n.w=n.h*a;n.x=o.x+o.w/2-n.w/2;if(m.includes('t'))n.y=o.y+o.h-n.h}
  if(n.x<-.5||n.y<-.5||n.x+n.w>W+.5||n.y+n.h>H+.5||n.w<MIN||n.h<MIN)return o}
 return n}

/* ---------- Instalar como app (PWA) ---------- */
let INST=null;
const isApp=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform=='MacIntel'&&navigator.maxTouchPoints>1);
const canInstall=()=>!isApp()&&(!!INST||isIOS());
const NAVX=()=>{const n=NAV;return canInstall()?[...n.slice(0,-1),['inst','Instalar app'],n[n.length-1]]:n};
async function instalarApp(){
 if(INST){INST.prompt();try{await INST.userChoice}catch(x){}INST=null;render();return}
 $('#modal').innerHTML=`<div class="ov"><div class="md"><h2 style="margin-top:0">Instalar no iPhone / iPad</h2><p>1. Abra este endereço no <b>Safari</b>.<br>2. Toque em <b>Compartilhar</b> (quadrado com seta para cima).<br>3. Toque em <b>Adicionar à Tela de Início</b>.</p><p class="muted">O app abre em tela cheia, sem a barra do navegador.</p><div class="bar"><span class="sp"></span><button type="button" class="pr" onclick="closeM()">Entendi</button></div></div></div>`}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();INST=e;if(typeof SES!=='undefined'&&SES&&!$('#modal').innerHTML)render()});
addEventListener('appinstalled',()=>{INST=null;toast('App instalado');if(typeof SES!=='undefined'&&SES)render()});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
const APP_VER='1.5.0';
(function(){const f=document.getElementById('ver');if(f)f.textContent='Fio-Mar Gestor · versão '+APP_VER;document.title=document.title})();
boot();
</script>
</body>
</html>
