<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fio-Mar Gestor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{--bg:#E9ECEF;--sf:#fff;--ink:#15212B;--mut:#5B6B79;--ln:#D3D9DF;--ac:#1B4F72;--on:#fff;--hi:#F5B700;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F161C;--sf:#18222B;--ink:#E8EDF1;--mut:#93A3B1;--ln:#2A3743;--ac:#6FB1E0;--on:#0F161C}}
:root[data-theme="dark"]{--bg:#0F161C;--sf:#18222B;--ink:#E8EDF1;--mut:#93A3B1;--ln:#2A3743;--ac:#6FB1E0;--on:#0F161C}
*{box-sizing:border-box}[hidden]{display:none!important}.fi{position:absolute!important;inset:0;width:100%!important;height:100%!important;opacity:0!important;margin:0!important;padding:0!important;border:0!important;cursor:pointer;font-size:0}label.btn{position:relative;overflow:hidden}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Barlow,system-ui,sans-serif}
h1,h2,h3,.num{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:600;margin:0}
h1{font-size:30px}h2{font-size:22px;margin:18px 0 8px}
#app{display:flex;min-height:100vh}
nav{width:200px;background:var(--ink);color:var(--bg);padding:20px 12px;position:sticky;top:0;height:100vh;flex-shrink:0}
nav .logo{font:700 28px "Barlow Condensed",sans-serif;padding:0 10px 18px;letter-spacing:.5px}
nav .logo b{color:var(--hi)}
nav a{display:block;padding:10px;border-radius:6px;color:inherit;cursor:pointer;opacity:.75;font-weight:500}
nav a.on{background:var(--hi);color:#15212B;opacity:1}
main{flex:1;padding:22px;max-width:980px;min-width:0}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.bar .sp{flex:1}
button,.btn{font:600 14px Barlow,sans-serif;border:1px solid var(--ln);background:var(--sf);color:var(--ink);padding:8px 13px;border-radius:6px;cursor:pointer;display:inline-block}
button.pr,.btn.pr{background:var(--ac);color:var(--on);border-color:var(--ac)}
button.wa{background:#1E9E55;color:#fff;border-color:#1E9E55}
button.sm{padding:4px 9px;font-size:13px}
button.dg{color:#C8553A;border-color:#C8553A}
.row:focus-visible,.tile:focus-visible,nav a:focus-visible,.tabs a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:14px;margin-bottom:10px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--sf);border:1px solid var(--ln);border-left:5px solid var(--hi);border-radius:8px;padding:12px 14px;cursor:pointer}
.tile .num{font-size:34px;line-height:1.1}.tile span{color:var(--mut);font-size:13px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px 14px;background:var(--sf);border:1px solid var(--ln);border-radius:8px;margin-bottom:8px;cursor:pointer}
.row small{color:var(--mut);display:block}.row .r{text-align:right;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.p{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--ln);margin-bottom:14px}
.tabs a{padding:8px 14px;cursor:pointer;white-space:nowrap;font-weight:600;color:var(--mut)}
.tabs a.on{color:var(--ink);border-bottom:3px solid var(--hi);margin-bottom:-2px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:10px;font-weight:500}
input,select,textarea{display:block;width:100%;margin-top:3px;padding:8px 10px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--ink);font:15px Barlow,sans-serif}
textarea{min-height:70px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.md{background:var(--sf);border-radius:10px;padding:18px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.ck{display:grid;grid-template-columns:130px 110px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}
.ck input,.ck select{margin:0}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ph figure{margin:0;background:var(--bg);border-radius:6px;overflow:hidden;font-size:12px}
.ph img{width:100%;height:110px;object-fit:cover;display:block}.ph figcaption{padding:5px 7px}
table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:left}th{color:var(--mut);font-size:13px}td.n,th.n{text-align:right}
.tot{font:600 24px "Barlow Condensed",sans-serif;text-align:right}
.recibo{background:#fff;color:#111;padding:28px;border-radius:8px;border:1px solid var(--ln)}
.recibo h1{text-align:center;border-bottom:3px solid #111;padding-bottom:8px;margin-bottom:14px}
.recibo td,.recibo th{border-color:#ccc}
.muted{color:var(--mut)}
#toast{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:6px;display:none;z-index:30}
@media (max-width:760px){
#app{display:block}
nav{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:auto;display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
nav .logo{display:none}nav{overflow-x:auto}nav a{flex:1 0 auto;text-align:center;padding:9px 10px;font-size:13px}
main{padding:14px 14px 90px}:root{padding-bottom:0}
.tiles{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}
.ck{grid-template-columns:1fr 1fr}.ck input[type=text]{grid-column:1/3}
}
@media print{nav,.bar,#toast{display:none!important}body{background:#fff}main{padding:0;max-width:none}.recibo{border:0}}
</style>
</head>
<body>
<div id="app"><nav id="nav"></nav><main id="main"></main></div>
<div id="modal"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const e=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const R=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const D=d=>d?d.split('-').reverse().join('/'):'';
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
const uid=()=>Math.random().toString(36).slice(2,9);
const CK=['Lataria','Pneus','Estepe','Óleo','Água/arrefecimento','Bateria','Faróis','Lanternas','Limpadores','Freios','Suspensão','Interior','Quilometragem'];
const FT=['Foto do veículo','Foto do defeito','Peças danificadas','Foto do scanner','Foto do osciloscópio','Antes do reparo','Depois do reparo'];
const ST=['Aberta','Em andamento','Aguardando peças','Concluída','Entregue'];
const FP=['Dinheiro','PIX','Cartão','Transferência','Parcelado'];
const SC={Aberta:'#2F6FB0','Em andamento':'#C98200','Aguardando peças':'#B4472E','Concluída':'#2E8B57',Entregue:'#5B6B79',Rascunho:'#5B6B79',Aguardando:'#C98200',Aprovado:'#2E8B57',Recusado:'#B4472E'};
const pill=s=>`<span class="p" style="--c:${SC[s]||'#777'}">${s=='Aguardando'?'Aguardando aprovação':s}</span>`;
const TERMOS='Autorizo a execução dos serviços e peças descritos neste orçamento. Valores e prazo podem mudar se novos defeitos forem encontrados; nesse caso, um novo aceite será solicitado.';

let db=load(),S={v:'dash',id:null,tab:'resumo',f:{},q:null};
function load(){return{clients:[],vehicles:[],quotes:[],orders:[],seq:1,qseq:1}}
/* ---------- Supabase: login e banco de dados ---------- */
const SBK='wab_sb';let SB=null,SES=null,TS=null,PEND=false,AM='in';
/* >>> PREENCHA AQUI UMA VEZ (Supabase: Project Settings > API). Com isso, ninguém precisa colar nada no aparelho. <<< */
const SB_URL='https://jnlzgximqqeknrzsqxcz.supabase.co',SB_KEY='sb_publishable_jjlMojbaAok74-O4j3JkZg_At3523HK';
const cfg0=()=>{if(SB_URL&&SB_KEY)return{url:SB_URL,key:SB_KEY};try{return JSON.parse(localStorage.getItem(SBK))||{}}catch(x){return{}}};
async function pull(){const{data,error}=await SB.from('wab_data').select('data').eq('id',SES.user.id).maybeSingle();
 if(error){toast('Erro ao carregar os dados: '+error.message);return}
 db=data&&data.data&&data.data.clients?data.data:load();if(!data)await push()}
async function push(){if(!SB||!SES||PEND)return;const{error}=await SB.from('wab_data').upsert({id:SES.user.id,data:db,updated_at:new Date().toISOString()});if(error)toast('Falha ao salvar na nuvem: '+error.message)}
function save(){clearTimeout(TS);TS=setTimeout(push,700)}
async function boot(){const c=cfg0();
 if(c.url&&c.key&&window.supabase){SB=window.supabase.createClient(c.url,c.key);const{data}=await SB.auth.getSession();if(data.session){SES=data.session;await gate();if(!PEND)await pull()}}
 render()}
function setMode(m){AM=m;authView()}
function authView(){const c=cfg0();$('#nav').style.display='none';
 if(!c.url||!c.key){$('#main').innerHTML=`<div class="card" style="max-width:420px;margin:8vh auto"><h1>Conectar ao Supabase</h1><p class="muted">Cole os dados do seu projeto (Project Settings, API). Isso é feito uma vez por aparelho.</p><label>Project URL<input id="su" placeholder="https://xxxx.supabase.co"></label><label>Chave anon public<input id="sk"></label><button class="pr" onclick="saveCfg()">Conectar</button></div>`;return}
 const up=AM=='up';
 $('#main').innerHTML=`<div class="card" style="max-width:380px;margin:8vh auto"><h1>Fio-Mar <b style="color:var(--hi)">Gestor</b></h1>
 <div class="tabs" style="margin-top:12px"><a class="${up?'':'on'}" onclick="setMode('in')">Entrar</a><a class="${up?'on':''}" onclick="setMode('up')">Criar conta</a></div>
 ${up?`<label>Nome<input id="ln" autocomplete="name"></label>`:''}<label>E-mail<input id="le" type="email" autocomplete="username"></label>
 <label>Senha${up?' (mínimo 6 caracteres)':''}<input id="lp" type="password" autocomplete="${up?'new-password':'current-password'}" ${up?'':`onkeydown="if(event.key=='Enter')login()"`}></label>
 ${up?`<label>Confirmar senha<input id="lp2" type="password" autocomplete="new-password" onkeydown="if(event.key=='Enter')signup()"></label>`:''}
 <p id="lerr" style="color:#C8553A;min-height:1.3em;margin:0 0 8px"></p>
 <button class="pr" style="width:100%" onclick="${up?'signup()':'login()'}">${up?'Criar conta':'Entrar'}</button>
 <p class="muted" style="margin-top:14px;font-size:13px">${up?'Depois de criar a conta, o administrador precisa liberar o seu e-mail para você ver os dados da oficina.':'Esqueceu a senha? Peça ao administrador para redefinir.'} <a href="#" onclick="resetCfg();return false">Trocar conexão</a></p></div>`}
function pendView(){$('#nav').style.display='none';$('#main').innerHTML=`<div class="card" style="max-width:420px;margin:8vh auto"><h1>Aguardando liberação</h1><p>Sua conta <b>${e(SES.user.email)}</b> foi criada, mas ainda não tem acesso aos dados da oficina.</p><p class="muted">Peça ao administrador para liberar este e-mail. Depois toque em “Verificar novamente”.</p><div class="bar"><button class="pr" onclick="recheck()">Verificar novamente</button><button onclick="doOut()">Sair</button></div></div>`}
let ADM=false;
async function gate(){const em=(SES.user.email||'').toLowerCase();const{data,error}=await SB.from('wab_members').select('email,admin').eq('email',em).maybeSingle();PEND=!error&&!data;ADM=!!(data&&data.admin);
 if(PEND)await SB.from('wab_requests').upsert({email:em,nome:(SES.user.user_metadata||{}).nome||''})}
async function resend(){const{error}=await SB.auth.resend({type:'signup',email:$('#le').value.trim(),options:{emailRedirectTo:location.href.split('#')[0]}});toast(error?'Erro: '+error.message:'E-mail de confirmação reenviado')}
async function loadTeam(){const el=$('#team');if(!el)return;
 const[r,m]=await Promise.all([SB.from('wab_requests').select('*'),SB.from('wab_members').select('*')]);
 const mm=m.data||[],rq=(r.data||[]).filter(x=>!mm.some(y=>y.email==x.email));
 el.innerHTML=`<h2>Pedidos de acesso</h2>`+(rq.map(x=>`<div class="row" style="cursor:default"><div>${e(x.nome||x.email)}<small>${e(x.email)}</small></div><div class="r"><button class="sm pr" onclick="aprovarReq('${e(x.email)}')">Aprovar</button><button class="sm dg" onclick="recusarReq('${e(x.email)}')">Recusar</button></div></div>`).join('')||'<p class="muted">Nenhum pedido pendente.</p>')+`<h2>Contas com acesso (assinantes)</h2>`+mm.map(x=>`<div class="row" style="cursor:default"><div>${e(x.email)}<small>${x.admin?'Administrador':'Usuário'}</small></div><div class="r">${x.email==(SES.user.email||'').toLowerCase()?'':`<button class="sm dg" onclick="confirmDel(this,()=>removeMember('${e(x.email)}'))">Remover</button>`}</div></div>`).join('')}
async function aprovarReq(em){const{error}=await SB.from('wab_members').insert({email:em,admin:false});if(error)return toast('Erro: '+error.message);await SB.from('wab_requests').delete().eq('email',em);toast('Acesso liberado');loadTeam()}
async function recusarReq(em){await SB.from('wab_requests').delete().eq('email',em);loadTeam()}
async function removeMember(em){const{error}=await SB.from('wab_members').delete().eq('email',em);if(error)return toast('Erro: '+error.message);loadTeam()}
function Vcfg(){if(ADM)setTimeout(loadTeam,0);return Vcfg0()+(ADM?'<div id="team"></div>':'')}
async function recheck(){await gate();if(!PEND)await pull();render();if(PEND)toast('Ainda não liberado')}
async function signup(){const em=$('#le').value.trim(),pw=$('#lp').value,p2=$('#lp2').value,m=$('#lerr');m.style.color='#C8553A';m.textContent='';
 if(!em||!pw)return m.textContent='Informe e-mail e senha.';
 if(pw.length<6)return m.textContent='A senha precisa ter ao menos 6 caracteres.';
 if(pw!==p2)return m.textContent='As senhas não são iguais.';
 const{data,error}=await SB.auth.signUp({email:em,password:pw,options:{data:{nome:($('#ln')||{}).value||''},emailRedirectTo:location.href.split('#')[0]}});
 if(error){const t=error.message;m.textContent=/already/i.test(t)?'Este e-mail já tem conta. Use a aba Entrar.':/not allowed|disabled/i.test(t)?'O cadastro de novas contas está desativado no Supabase.':/password/i.test(t)?'Senha fraca. Use ao menos 6 caracteres.':'Erro: '+t;return}
 if(data.session){SES=data.session;await gate();if(!PEND)await pull();S.v='dash';render()}
 else{m.style.color='var(--ac)';m.textContent='Conta criada. Enviamos um link de confirmação para '+em+'. Confirme o e-mail, entre e aguarde a liberação do administrador.'}}
function saveCfg(){const url=$('#su').value.trim().replace(/\/$/,''),key=$('#sk').value.trim();if(!/^https:\/\/.+/.test(url)||key.length<20)return toast('Informe a URL e a chave anon do projeto');localStorage.setItem(SBK,JSON.stringify({url,key}));boot()}
function resetCfg(){localStorage.removeItem(SBK);SB=null;boot()}
async function login(){const em=$('#le').value.trim(),pw=$('#lp').value;$('#lerr').textContent='';if(!em||!pw){$('#lerr').textContent='Informe e-mail e senha.';return}
 const{data,error}=await SB.auth.signInWithPassword({email:em,password:pw});
 if(error){if(/not confirmed/i.test(error.message)){$('#lerr').innerHTML='Confirme o e-mail pelo link enviado antes de entrar. <a href="#" onclick="resend();return false">Reenviar e-mail</a>';return}$('#lerr').textContent=/invalid/i.test(error.message)?'E-mail ou senha incorretos.':'Erro: '+error.message;return}
 SES=data.session;await gate();if(!PEND)await pull();S.v='dash';render()}
async function doOut(){clearTimeout(TS);await push();await SB.auth.signOut();SES=null;ADM=false;db=load();db=load();S.v='dash';render()}
function dlBlob(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove();toast('PDF baixado')}
function toast(t){const o=$('#toast');o.textContent=t;o.style.display='block';setTimeout(()=>o.style.display='none',2400)}
const cl=id=>db.clients.find(x=>x.id==id)||{};
const vh=id=>db.vehicles.find(x=>x.id==id)||{};
const od=id=>db.orders.find(x=>x.id==id);
const sum=(it,d)=>it.reduce((a,i)=>a+(+i.q||0)*(+i.v||0),0)-(+d||0);
const oTot=o=>sum(o.items,o.desc),paid=o=>o.pags.reduce((a,p)=>a+(+p.valor||0),0);
const vlabel=v=>`${v.modelo||'?'} ${v.placa||''}`;
function go(v,id,tab,f){S.v=v;S.id=id||null;S.tab=tab||'resumo';S.f=f||{};render();scrollTo(0,0)}

/* modal genérico: campos [chave,rótulo,tipo,opções,obrigatório] */
let MD=null;
function confirmDel(b,fn){if(b.dataset.s)return fn();b.dataset.s=1;const t=b.textContent;b.textContent='Toque de novo para confirmar';setTimeout(()=>{delete b.dataset.s;b.textContent=t},3500)}
function modal(t,fields,vals,cb,extra,del){MD=del;
 const inp=([k,l,ty,o,r])=>`<label>${l}`+(ty=='select'?`<select name="${k}">${o.map(x=>{const[v,n]=Array.isArray(x)?x:[x,x];return`<option value="${e(v)}" ${vals[k]==v?'selected':''}>${e(n)}</option>`}).join('')}</select>`:ty=='area'?`<textarea name="${k}">${e(vals[k])}</textarea>`:`<input name="${k}" type="${ty||'text'}" ${ty=='number'?'step="any"':''} value="${e(vals[k])}" ${r?'required':''}>`)+`</label>`;
 $('#modal').innerHTML=`<div class="ov"><form class="md"><h2 style="margin-top:0">${t}</h2>${extra||''}${fields.map(inp).join('')}<div class="bar" style="margin:6px 0 0">${del?'<button type="button" class="dg" onclick="confirmDel(this,()=>{closeM();MD()})">Excluir</button>':''}<span class="sp"></span><button type="button" onclick="closeM()">Cancelar</button><button class="pr">Salvar</button></div></form></div>`;
 $('#modal form').onsubmit=ev=>{ev.preventDefault();const o=Object.fromEntries(new FormData(ev.target));closeM();cb(o)};
}
const closeM=()=>$('#modal').innerHTML='';

/* ---------- Clientes ---------- */
const CF=[['nome','Nome','text',0,1],['doc','CPF/CNPJ'],['tel','Telefone/WhatsApp','tel',0,1],['end','Endereço']];
function editClient(id){const c=cl(id);modal(id?'Editar cliente':'Novo cliente',CF,c,o=>{if(id)Object.assign(c,o);else db.clients.push({id:uid(),...o});save();render()},0,id&&(()=>delClient(id)))}
function Vclients(){const q=(S.f.q||'').toLowerCase();
 return`<div class="bar"><h1>Clientes</h1><span class="sp"></span><button class="pr" onclick="editClient()">Novo cliente</button></div>
 <input placeholder="Buscar por nome ou telefone" value="${e(S.f.q)}" oninput="S.f.q=this.value;render(1)" style="margin-bottom:12px">`+
 (db.clients.filter(c=>(c.nome+c.tel).toLowerCase().includes(q)).map(c=>{const n=db.orders.filter(o=>o.cli==c.id).length;
 return`<div class="row" onclick="editClient('${c.id}')"><div>${e(c.nome)}<small>${e(c.tel)} ${e(c.end)}</small></div><div class="r"><span class="muted">${n} serviço(s)</span><button class="sm" onclick="event.stopPropagation();go('orders',0,0,{cli:'${c.id}'})">Histórico</button></div></div>`}).join('')||'<p class="muted">Nenhum cliente. Toque em “Novo cliente” para cadastrar.</p>')}

/* ---------- Veículos ---------- */
function editVeh(id){const v=vh(id);const F=[['cli','Cliente','select',db.clients.map(c=>[c.id,c.nome])],['placa','Placa','text',0,1],['modelo','Marca/modelo','text',0,1],['ano','Ano','number'],['km','Quilometragem','number'],['motor','Motor'],['cor','Cor'],['obs','Observações','area']];
 if(!db.clients.length)return toast('Cadastre um cliente primeiro');
 modal(id?'Editar veículo':'Novo veículo',F,v,o=>{o.placa=o.placa.toUpperCase();if(id)Object.assign(v,o);else db.vehicles.push({id:uid(),...o});save();render()},0,id&&(()=>delVeh(id)))}
function Vvehicles(){return`<div class="bar"><h1>Veículos</h1><span class="sp"></span><button class="pr" onclick="editVeh()">Novo veículo</button></div>`+
 (db.vehicles.map(v=>`<div class="row" onclick="editVeh('${v.id}')"><div>${e(vlabel(v))} <span class="muted">${e(v.ano)} ${e(v.cor)}</span><small>${e(cl(v.cli).nome)} — ${e(v.km)} km ${e(v.motor)}</small></div><div class="r"><button class="sm" onclick="event.stopPropagation();go('orders',0,0,{vei:'${v.id}'})">Histórico</button></div></div>`).join('')||'<p class="muted">Nenhum veículo cadastrado.</p>')}

/* ---------- Orçamentos ---------- */
function Vquotes(){return`<div class="bar"><h1>Orçamentos</h1><span class="sp"></span><button class="pr" onclick="editQuote()">Novo orçamento</button></div>`+
 (db.quotes.slice().reverse().map(q=>`<div class="row" onclick="editQuote('${q.id}')"><div>Orçamento ${q.n} — ${e(cl(q.cli).nome)}<small>${e(vlabel(vh(q.veh)))}</small></div><div class="r">${pill(q.status)}<b>${R(sum(q.items,q.desc))}</b></div></div>`).join('')||'<p class="muted">Nenhum orçamento ainda.</p>')}
function editQuote(id){const q=id?db.quotes.find(x=>x.id==id):{id:uid(),n:db.qseq,cli:db.clients[0]?.id,veh:db.vehicles.find(x=>x.cli==db.clients[0]?.id)?.id||'',items:[],desc:0,prazo:'',obs:'',status:'Rascunho',novo:1};
 if(!q.cli)return toast('Cadastre um cliente primeiro');S.q=JSON.parse(JSON.stringify(q));go('quote')}
function qs(k,v){S.q[k]=v;if(k=='cli'){S.q.veh=db.vehicles.find(x=>x.cli==v)?.id||'';render()}if(k=='desc')$('#qt').textContent=R(sum(S.q.items,S.q.desc))}
function addItem(w){modal('Adicionar item',[['t','Tipo','select',['Serviço','Peça','Mão de obra']],['d','Descrição','text',0,1],['det','Detalhes (opcional)'],['q','Quantidade','number',0,1],['v','Valor unitário (R$)','number',0,1]],{q:1,t:'Serviço'},o=>{w.items.push({...o,q:+o.q,v:+o.v});save();render()})}
function saveQuote(quiet){const q=S.q;if(!q.veh)q.veh=db.vehicles.find(v=>v.cli==q.cli)?.id||'';
 if(q.novo){delete q.novo;db.qseq++;db.quotes.push(q)}else db.quotes[db.quotes.findIndex(x=>x.id==q.id)]=q;save();if(!quiet)toast('Orçamento salvo')}
function approve(){if(!db.vehicles.some(v=>v.cli==S.q.cli))return toast('Cadastre um veículo para este cliente');saveQuote(1);modal('Aceite do cliente',[['nome','Nome de quem aprova (assinatura)','text',0,1]],{},o=>{Object.assign(S.q,{status:'Aprovado',aprov:{nome:o.nome,data:today()}});saveQuote();render()},`<p class="muted">${TERMOS}</p>`)}
function makeOS(){if(!db.vehicles.some(v=>v.cli==S.q.cli))return toast('Cadastre um veículo para este cliente');saveQuote(1);const q=S.q;const o={id:uid(),num:String(db.seq++).padStart(4,'0'),cli:q.cli,veh:q.veh,qid:q.id,problema:q.obs||'',mec:'',status:'Aberta',items:JSON.parse(JSON.stringify(q.items)),desc:q.desc,ck:{},laudo:{data:today()},fotos:(q.fotos||[]).map(f=>({id:uid(),t:'Foto do veículo',src:f.src,obs:f.obs})),pags:[],horas:'',pecas:'',aberta:today()};
 db.orders.push(o);q.os=o.id;saveQuote(1);go('order',o.id)}
function wa(phone,txt){let p=String(phone||'').replace(/\D/g,'');if(!p)return toast('Cliente sem telefone cadastrado');if(p.length<=11)p='55'+p;const u=`https://wa.me/${p}?text=${encodeURIComponent(txt)}`;let w=null;try{w=window.open(u,'_blank')}catch(x){}if(!w)waFallback(u,txt)}
let WT='';
function waFallback(u,txt){WT=txt;$('#modal').innerHTML=`<div class="ov"><div class="md"><h2 style="margin-top:0">Enviar por WhatsApp</h2><p class="muted">O navegador bloqueou a abertura automática. Toque em “Abrir WhatsApp” ou copie a mensagem e cole na conversa.</p><textarea readonly onfocus="this.select()">${e(txt)}</textarea><div class="bar" style="margin:10px 0 0"><a class="btn" href="${u}" target="_blank" rel="noopener" style="background:#1E9E55;color:#fff;border-color:#1E9E55;text-decoration:none">Abrir WhatsApp</a><button onclick="navigator.clipboard&&navigator.clipboard.writeText(WT).then(()=>toast('Mensagem copiada'),()=>toast('Selecione o texto e copie'))">Copiar mensagem</button><span class="sp"></span><button onclick="closeM()">Fechar</button></div></div></div>`}
function waQuote(){const q=S.q;wa(cl(q.cli).tel,`Olá ${cl(q.cli).nome}! Segue o orçamento ${q.n} do ${vlabel(vh(q.veh))}:\n${q.items.map(i=>`- ${i.d} (${i.q}x ${R(i.v)})`).join('\n')}\nTotal: ${R(sum(q.items,q.desc))}\nPrazo: ${q.prazo||'a combinar'}\nPosso confirmar a aprovação?`);if(q.status=='Rascunho'){q.status='Aguardando';saveQuote(1);render()}}
function Vquote(){const q=S.q,vs=db.vehicles.filter(v=>v.cli==q.cli),ro=q.status=='Aprovado';
 return`<div class="bar"><button onclick="(S.q.novo&&!S.q.items.length)||saveQuote(1);go('quotes')">Voltar</button><h1>Orçamento ${q.n}</h1><span class="sp"></span>${pill(q.status)}</div>
 <div class="card"><div class="g2"><label>Cliente<select onchange="qs('cli',this.value)">${db.clients.map(c=>`<option value="${c.id}" ${c.id==q.cli?'selected':''}>${e(c.nome)}</option>`).join('')}</select></label>
 <label>Veículo<select onchange="qs('veh',this.value)">${vs.length?vs.map(v=>`<option value="${v.id}" ${v.id==q.veh?'selected':''}>${e(vlabel(v))}</option>`).join(''):'<option value="">Cadastre um veículo para este cliente</option>'}</select></label>
 <label>Prazo<input value="${e(q.prazo)}" placeholder="Ex.: 3 dias úteis" onchange="qs('prazo',this.value)"></label>
 <label>Desconto (R$)<input type="number" step="any" value="${q.desc}" onchange="qs('desc',this.value)"></label></div>
 <label>Observações / problema relatado<textarea onchange="qs('obs',this.value)">${e(q.obs)}</textarea></label></div>
 <div class="card"><table><tr><th>Item</th><th class="n">Qtd</th><th class="n">Total</th><th></th></tr>${q.items.map((i,n)=>`<tr><td>${e(i.d)}<br><small class="muted">${i.t} — ${R(i.v)}</small></td><td class="n">${i.q}</td><td class="n">${R(i.q*i.v)}</td><td><button class="sm" onclick="S.q.items.splice(${n},1);render()">×</button></td></tr>`).join('')||'<tr><td colspan="4" class="muted">Adicione serviços, peças e mão de obra.</td></tr>'}</table>
 <div class="bar" style="margin-top:10px"><button onclick="addItem(S.q)">Adicionar item</button><button onclick="addStock(S.q,0)">Peça do estoque</button><span class="sp"></span><span class="muted">Total</span><span class="tot" id="qt">${R(sum(q.items,q.desc))}</span></div></div>
 <div class="card"><div class="bar" style="margin:0 0 8px"><b>Fotos do orçamento</b><span class="sp"></span><label class="btn sm" style="margin:0">Adicionar fotos<input type="file" accept="image/*" multiple class="fi" onchange="toast('Processando foto...');qFotos([...this.files]);this.value=''"></label></div><div class="ph">${(q.fotos||[]).map((f,i)=>`<figure><img src="${f.src}" alt="Foto ${i+1}"><figcaption><input value="${e(f.obs)}" placeholder="Legenda" onchange="S.q.fotos[${i}].obs=this.value"><button class="sm" style="margin-top:4px" onclick="S.q.fotos.splice(${i},1);render()">Remover</button></figcaption></figure>`).join('')}</div></div>
 <div class="card"><b>Termos de aprovação</b><p class="muted">${TERMOS}</p>${q.aprov?`<p>Aprovado por <b>${e(q.aprov.nome)}</b> em ${D(q.aprov.data)}.</p>`:''}</div>
 <div class="bar"><button onclick="saveQuote()">Salvar</button><button class="pr" onclick="genPDF(S.q)">Gerar PDF</button>${q.novo?'':'<button class="dg" onclick="confirmDel(this,delQuote)">Excluir</button>'}<button class="wa" onclick="waQuote()">Enviar por WhatsApp</button>${ro?'':`<button onclick="approve()">Registrar aprovação</button><button onclick="S.q.status='Recusado';saveQuote();render()">Marcar recusado</button>`}${ro&&!q.os?`<button class="pr" onclick="makeOS()">Gerar O.S.</button>`:''}${q.os?`<button class="pr" onclick="go('order','${q.os}')">Abrir O.S.</button>`:''}</div>`}

/* ---------- Ordens de serviço ---------- */
function newOS(){if(!db.vehicles.length)return toast('Cadastre um veículo primeiro');
 modal('Nova O.S. direta',[['veh','Veículo','select',db.vehicles.map(v=>[v.id,vlabel(v)+' — '+cl(v.cli).nome])],['problema','Problema relatado','area']],{},f=>{const v=vh(f.veh);const o={id:uid(),num:String(db.seq++).padStart(4,'0'),cli:v.cli,veh:v.id,problema:f.problema,mec:'',status:'Aberta',items:[],desc:0,ck:{},laudo:{data:today()},fotos:[],pags:[],horas:'',pecas:'',aberta:today()};db.orders.push(o);save();go('order',o.id)})}
function Vorders(){const f=S.f;let l=db.orders.filter(o=>(!f.cli||o.cli==f.cli)&&(!f.vei||o.veh==f.vei)&&(!f.st||(f.st=='abertas'?!['Concluída','Entregue'].includes(o.status):f.st=='receber'?oTot(o)>paid(o):o.status==f.st)));
 const chip=(k,t)=>`<button class="sm ${(f.st||'')==k?'pr':''}" onclick="S.f.st=${k?`'${k}'`:'null'};render()">${t}</button>`;
 return`<div class="bar"><h1>Ordens de serviço</h1><span class="sp"></span><button class="pr" onclick="newOS()">Nova O.S.</button></div>
 <div class="bar">${chip('','Todas')}${chip('abertas','Abertas')}${ST.map(s=>chip(s,s)).join('')}${chip('receber','A receber')}${f.cli||f.vei?`<button class="sm" onclick="go('orders')">Limpar filtro</button>`:''}</div>`+
 (l.slice().reverse().map(o=>`<div class="row" onclick="go('order','${o.id}')"><div>O.S. ${o.num} — ${e(vlabel(vh(o.veh)))}<small>${e(cl(o.cli).nome)} — aberta em ${D(o.aberta)}</small></div><div class="r">${pill(o.status)}<b>${R(oTot(o))}</b></div></div>`).join('')||'<p class="muted">Nenhuma O.S. neste filtro.</p>')}
const U=(k,v)=>{od(S.id)[k]=v;save()},UG=(g,k,v)=>{od(S.id)[g][k]=v;save()};
function pic(file,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.6))};i.onerror=()=>toast('Não foi possível abrir esta foto. Tente outra imagem.');i.src=r.result};r.readAsDataURL(file)}
function ckSet(n,k,v){const o=od(S.id);(o.ck[n]=o.ck[n]||{})[k]=v;save()}
function ckFoto(n,f){if(f)pic(f,d=>{ckSet(n,'foto',d);render()})}
function addFotos(fs){const o=od(S.id),t=$('#ft').value;[...fs].forEach(f=>pic(f,d=>{o.fotos.push({id:uid(),t,src:d,obs:''});save();render()}))}
function addPag(){const o=od(S.id);modal('Registrar pagamento',[['forma','Forma','select',FP],['valor','Valor pago (R$)','number',0,1],['parc','Parcelas (se parcelado)','number'],['data','Data','date',0,1]],{valor:Math.max(0,oTot(o)-paid(o)),data:today(),parc:1},p=>{o.pags.push({...p,valor:+p.valor});save();render()})}
function waOS(){const o=od(S.id);wa(cl(o.cli).tel,`Olá ${cl(o.cli).nome}! O.S. ${o.num} do ${vlabel(vh(o.veh))}: status "${o.status}". Total ${R(oTot(o))}, pago ${R(paid(o))}, restante ${R(oTot(o)-paid(o))}.`)}
function Vorder(){const o=od(S.id);if(!o)return Vorders();const T=[['resumo','Resumo'],['check','Checklist'],['laudo','Laudo'],['fotos','Fotos'],['pag','Pagamento']];
 let b='';
 if(S.tab=='resumo')b=`<div class="card"><div class="g2"><label>Mecânico responsável<input value="${e(o.mec)}" onchange="U('mec',this.value)"></label><label>Horas de mão de obra<input value="${e(o.horas)}" onchange="U('horas',this.value)"></label></div>
 <label>Problema relatado<textarea onchange="U('problema',this.value)">${e(o.problema)}</textarea></label><label>Peças utilizadas<textarea onchange="U('pecas',this.value)">${e(o.pecas)}</textarea></label></div>
 <div class="card"><b>Serviços autorizados</b><table>${o.items.map((i,n)=>`<tr><td>${e(i.d)}<br><small class="muted">${i.t}</small></td><td class="n">${i.q}x</td><td class="n">${R(i.q*i.v)}</td><td><button class="sm" onclick="rmOS(${n})">×</button></td></tr>`).join('')||'<tr><td class="muted">Nenhum item.</td></tr>'}</table>
 <div class="bar" style="margin-top:10px"><button onclick="addItem(od(S.id))">Adicionar item</button><button onclick="addStock(od(S.id),1)">Peça do estoque</button><span class="sp"></span><span class="tot">${R(oTot(o))}</span></div></div>`;
 if(S.tab=='check')b=`<div class="bar"><button class="pr" onclick="genChecklist(od(S.id))">Gerar PDF do checklist</button></div><div class="card">${CK.map((n,i)=>{const c=o.ck[n]||{};return`<div class="ck"><b>${n}</b><select onchange="ckSet('${n}','s',this.value)">${['—','OK','Atenção','Defeito'].map(x=>`<option ${c.s==x?'selected':''}>${x}</option>`).join('')}</select><input type="text" placeholder="Observação" value="${e(c.obs)}" onchange="ckSet('${n}','obs',this.value)"><label class="btn sm" style="margin:0">${c.foto?'<img src="'+c.foto+'" height="26" alt="foto">':'Foto'}<input type="file" accept="image/*" class="fi" onchange="toast('Processando foto...');ckFoto('${n}',this.files[0])"></label></div>`}).join('')}</div>`;
 if(S.tab=='laudo'){const L=o.laudo;const t=(k,l,a)=>`<label>${l}${a?`<textarea onchange="UG('laudo','${k}',this.value)">${e(L[k])}</textarea>`:`<input value="${e(L[k])}" onchange="UG('laudo','${k}',this.value)">`}</label>`;
 b=`<div class="bar"><button class="pr" onclick="genLaudo(od(S.id))">Gerar PDF do laudo</button></div><div class="card">${t('rec','Reclamação do cliente',1)}${t('testes','Testes realizados',1)}${t('equip','Equipamentos utilizados')}${t('cod','Códigos de falha')}${t('diag','Diagnóstico',1)}${t('causa','Causa provável',1)}${t('sol','Solução recomendada',1)}<div class="g2">${t('tec','Técnico responsável')}<label>Data<input type="date" value="${L.data||''}" onchange="UG('laudo','data',this.value)"></label></div></div>`}
 if(S.tab=='fotos')b=`<div class="card"><div class="bar"><select id="ft" style="width:auto;margin:0">${FT.map(x=>`<option>${x}</option>`).join('')}</select><label class="btn pr" style="margin:0;color:var(--on)">Tirar ou enviar foto<input type="file" accept="image/*" multiple class="fi" onchange="toast('Processando foto...');addFotos([...this.files]);this.value=''"></label></div></div>
 <div class="ph">${o.fotos.map((f,i)=>`<figure><img src="${f.src}" alt="${e(f.t)}"><figcaption><b>${f.t}</b><br><input value="${e(f.obs)}" placeholder="Observação" onchange="od(S.id).fotos[${i}].obs=this.value;save()"><button class="sm" style="margin-top:4px" onclick="od(S.id).fotos.splice(${i},1);save();render()">Remover</button></figcaption></figure>`).join('')}</div>${o.fotos.length?'':'<p class="muted">As fotos ficam vinculadas a esta O.S. como prova do que foi encontrado e executado.</p>'}`;
 if(S.tab=='pag'){const rest=oTot(o)-paid(o);b=`<div class="card"><table><tr><td>Total</td><td class="n">${R(oTot(o))}</td></tr><tr><td>Valor pago</td><td class="n">${R(paid(o))}</td></tr><tr><td><b>Valor restante</b></td><td class="n"><b>${R(rest)}</b></td></tr></table>
 <div class="bar" style="margin-top:10px"><button class="pr" onclick="addPag()">Registrar pagamento</button>${o.pags.length?`<button onclick="go('recibo','${o.id}')">Gerar recibo</button>`:''}</div></div>`+o.pags.map((p,i)=>`<div class="row" style="cursor:default"><div>${p.forma}${p.forma=='Parcelado'?' em '+p.parc+'x':''}<small>${D(p.data)}</small></div><div class="r"><b>${R(p.valor)}</b><button class="sm" onclick="od(S.id).pags.splice(${i},1);save();render()">×</button></div></div>`).join('')}
 return`<div class="bar"><button onclick="go('orders')">Voltar</button><h1>O.S. ${o.num}</h1><span class="sp"></span><select style="width:auto;margin:0" onchange="U('status',this.value);render()">${ST.map(s=>`<option ${o.status==s?'selected':''}>${s}</option>`).join('')}</select></div>
 <p style="margin:0 0 12px"><b>${e(vlabel(vh(o.veh)))}</b> <span class="muted">${e(cl(o.cli).nome)}</span> ${pill(o.status)} <button class="wa sm" onclick="waOS()">WhatsApp</button> <button class="dg sm" onclick="confirmDel(this,delOS)">Excluir O.S.</button></p>
 <div class="tabs">${T.map(([k,l])=>`<a class="${S.tab==k?'on':''}" onclick="S.tab='${k}';render()">${l}</a>`).join('')}</div>${b}`}

/* ---------- Recibo ---------- */
function reciboTxt(o){return`RECIBO DE PAGAMENTO - O.S. ${o.num}\nCliente: ${cl(o.cli).nome}\nVeículo: ${vlabel(vh(o.veh))}\nTotal: ${R(oTot(o))}\nPago: ${R(paid(o))}\nRestante: ${R(oTot(o)-paid(o))}`}
function Vrecibo(){const o=od(S.id),v=vh(o.veh),c=cl(o.cli);
 return`<div class="bar"><button onclick="go('order','${o.id}','pag')">Voltar</button><span class="sp"></span><button class="pr" onclick="genRecibo(od(S.id))">Salvar PDF</button><button onclick="navigator.clipboard&&navigator.clipboard.writeText(reciboTxt(od(S.id))).then(()=>toast('Texto copiado'))">Copiar texto</button><button class="wa" onclick="wa(cl(od(S.id).cli).tel,reciboTxt(od(S.id)))">Enviar por WhatsApp</button></div>
 <div class="recibo"><h1>RECIBO DE PAGAMENTO</h1><p><b>${e((db.cfg||{}).nome||'Oficina')}</b><br>O.S. ${o.num} — emitido em ${D(today())}</p>
 <p>Cliente: <b>${e(c.nome)}</b> ${e(c.doc)}<br>Veículo: <b>${e(vlabel(v))}</b> ${e(v.ano)} ${e(v.cor)} — ${e(v.km)} km</p>
 <table><tr><th>Item</th><th class="n">Qtd</th><th class="n">Total</th></tr>${o.items.map(i=>`<tr><td>${e(i.d)}</td><td class="n">${i.q}</td><td class="n">${R(i.q*i.v)}</td></tr>`).join('')}${+o.desc?`<tr><td>Desconto</td><td></td><td class="n">-${R(o.desc)}</td></tr>`:''}<tr><td colspan="2"><b>Total</b></td><td class="n"><b>${R(oTot(o))}</b></td></tr></table>
 <h2>Pagamentos</h2><table>${o.pags.map(p=>`<tr><td>${D(p.data)}</td><td>${p.forma}${p.forma=='Parcelado'?' '+p.parc+'x':''}</td><td class="n">${R(p.valor)}</td></tr>`).join('')}<tr><td colspan="2"><b>Valor pago</b></td><td class="n"><b>${R(paid(o))}</b></td></tr><tr><td colspan="2">Valor restante</td><td class="n">${R(oTot(o)-paid(o))}</td></tr></table>
 <p style="margin-top:40px;text-align:center">______________________________<br>${e((db.cfg||{}).nome||'Oficina')}</p></div>`}

/* ---------- Painel ---------- */
function Vdash(){const O=db.orders,m=today().slice(0,7);
 const rec=O.reduce((a,o)=>a+Math.max(0,oTot(o)-paid(o)),0),fat=O.reduce((a,o)=>a+o.pags.filter(p=>(p.data||'').startsWith(m)).reduce((x,p)=>x+p.valor,0),0);
 const T=(n,l,f,v)=>`<div class="tile" onclick="${f}"><div class="num">${n}</div><span>${l}</span></div>`;
 const open=O.filter(o=>!['Concluída','Entregue'].includes(o.status));
 return`<h1 style="margin-bottom:14px">Painel da oficina</h1><div class="tiles">
 ${T(O.filter(o=>o.status=='Em andamento').length,'Serviços em andamento',"go('orders',0,0,{st:'Em andamento'})")}
 ${T(db.quotes.filter(q=>q.status=='Aguardando').length,'Orçamentos aguardando aprovação',"go('quotes')")}
 ${T(open.length,'O.S. abertas',"go('orders',0,0,{st:'abertas'})")}
 ${T(O.filter(o=>o.status=='Aguardando peças').length,'Carros aguardando peças',"go('orders',0,0,{st:'Aguardando peças'})")}
 ${T(R(rec),'Contas a receber',"go('orders',0,0,{st:'receber'})")}
 ${T(R(fat),'Faturamento do mês',"go('orders')")}</div>
 <h2>Carros no pátio</h2>`+(open.map(o=>`<div class="row" onclick="go('order','${o.id}')"><div>${e(vlabel(vh(o.veh)))}<small>${e(cl(o.cli).nome)} — O.S. ${o.num}</small></div><div class="r">${pill(o.status)}</div></div>`).join('')||'<p class="muted">Nenhum carro em serviço. Crie um orçamento ou uma O.S. para começar.</p>')+
 `<p class="muted" style="margin-top:22px">Fluxo: cliente, veículo, orçamento, aprovação, O.S., checklist, laudo, fotos, pagamento, recibo e WhatsApp. Os dados ficam salvos neste navegador.</p><div class="bar"><button onclick="backup()">Copiar backup</button><button onclick="restore()">Restaurar backup</button></div>`}

function delClient(id){if(db.orders.some(o=>o.cli==id)||db.quotes.some(q=>q.cli==id))return toast('Este cliente tem orçamentos ou O.S. Exclua-os antes');db.vehicles=db.vehicles.filter(v=>v.cli!=id);db.clients=db.clients.filter(c=>c.id!=id);save();render();toast('Cliente excluído')}
function delVeh(id){if(db.orders.some(o=>o.veh==id)||db.quotes.some(q=>q.veh==id))return toast('Este veículo tem orçamentos ou O.S. Exclua-os antes');db.vehicles=db.vehicles.filter(v=>v.id!=id);save();render();toast('Veículo excluído')}
